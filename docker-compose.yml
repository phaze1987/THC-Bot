services:
  bot-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: thcbot:dev-latest
    command: python -m tornbot.bot
    env_file:
      - .env.dev
    restart: unless-stopped
    volumes:
      - ./data-dev:/app/data

  bot-prod:
    image: "thcbot:prod-${PROD_TAG}"
    command: python -m tornbot.bot
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - ./data-prod:/app/data
